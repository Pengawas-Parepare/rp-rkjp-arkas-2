<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pendampingan Sekolah Binaan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182b22;
    --ink-soft:#3f5347;
    --paper:#f3f0e6;
    --paper-2:#fbfaf5;
    --line:#d8d2c0;
    --line-strong:#b9b19a;
    --pine:#1f4034;
    --pine-2:#2c5a49;
    --gold:#b9862f;
    --gold-soft:#f1e3c4;
    --berdaya:#2c5a49;
    --berdaya-bg:#e2ede7;
    --berkembang:#8a5a1e;
    --berkembang-bg:#f4e6cd;
    --utama:#7a2620;
    --utama-bg:#f3e0dd;
    --menengah:#8a5a1e;
    --menengah-bg:#f4e6cd;
    --akhir:#2c5a49;
    --akhir-bg:#e2ede7;
    --danger:#912e28;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', -apple-system, sans-serif;
    font-size:15px;
    line-height:1.55;
  }
  h1,h2,h3,.serif{ font-family:'Source Serif 4', Georgia, serif; }
  .app{ max-width:1180px; margin:0 auto; padding:0 24px 80px; }

  /* top identity bar */
  .masthead{
    border-bottom:2px solid var(--pine);
    padding:22px 0 16px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;
  }
  .masthead .mark{ display:flex; align-items:center; gap:14px; }
  .mark .seal{
    width:42px; height:42px; border-radius:50%; border:2px solid var(--pine);
    display:flex; align-items:center; justify-content:center;
    font-family:'Source Serif 4',serif; font-weight:600; color:var(--pine); font-size:15px;
    flex:none;
  }
  .masthead h1{ font-size:22px; font-weight:600; margin:0; color:var(--pine); letter-spacing:.2px; }
  .masthead .tagline{ margin:2px 0 0; font-size:13px; color:var(--ink-soft); }
  .profil-btn{
    background:none; border:1px solid var(--line-strong); color:var(--ink-soft);
    font-family:'Public Sans',sans-serif; font-size:13px; padding:7px 14px; border-radius:3px; cursor:pointer;
  }
  .profil-btn:hover{ border-color:var(--pine); color:var(--pine); }

  /* stepper nav */
  .stepper{ display:flex; gap:2px; margin:22px 0 30px; border:1px solid var(--line); background:var(--paper-2); border-radius:4px; overflow:hidden; flex-wrap:wrap;}
  .step-btn{
    flex:1; min-width:150px; text-align:left; background:none; border:none; cursor:pointer;
    padding:13px 16px; border-right:1px solid var(--line); font-family:'Public Sans',sans-serif;
    color:var(--ink-soft);
  }
  .step-btn:last-child{ border-right:none; }
  .step-btn .num{ font-size:11px; letter-spacing:.4px; display:block; margin-bottom:3px; color:var(--line-strong); }
  .step-btn .lbl{ font-size:14px; font-weight:500; display:block; }
  .step-btn.active{ background:var(--pine); color:#fff; }
  .step-btn.active .num{ color:var(--gold-soft); }
  .step-btn.active .lbl{ color:#fff; }
  .step-btn:not(.active):hover{ background:var(--paper); }

  /* panel */
  .panel{ background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:26px 30px; margin-bottom:22px; }
  .panel h2{ font-size:19px; margin:0 0 4px; color:var(--pine); font-weight:600; }
  .panel .sub{ color:var(--ink-soft); font-size:13.5px; margin:0 0 20px; max-width:640px; }
  .section-divider{ border:none; border-top:1px solid var(--line); margin:26px 0; }

  /* dashboard */
  .metrics{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:26px; }
  .metric{ background:var(--paper-2); border:1px solid var(--line); border-radius:4px; padding:16px 18px; }
  .metric .n{ font-family:'Source Serif 4',serif; font-size:30px; color:var(--pine); font-weight:600; line-height:1; }
  .metric .l{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; }

  table.roster{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.roster th{ text-align:left; font-size:11.5px; letter-spacing:.3px; color:var(--ink-soft); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--line-strong); }
  table.roster td{ padding:11px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.roster tr:hover td{ background:var(--paper); cursor:pointer; }
  table.roster.local th:nth-child(5),table.roster.local td:nth-child(5),table.roster.local th:nth-child(9),table.roster.local td:nth-child(9){ display:none; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:3px; font-size:12px; font-weight:500; }
  .badge.berdaya{ background:var(--berdaya-bg); color:var(--berdaya); }
  .badge.berkembang{ background:var(--berkembang-bg); color:var(--berkembang); }
  .badge.rendah{ background:var(--utama-bg); color:var(--utama); }
  .badge.sedang{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.tinggi{ background:var(--akhir-bg); color:var(--akhir); }
  .badge.prioritas-utama{ background:var(--utama-bg); color:var(--utama); }
  .badge.prioritas-menengah{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.prioritas-akhir{ background:var(--akhir-bg); color:var(--akhir); }
  .badge.muted{ background:#eae6d8; color:var(--ink-soft); }
  .badge.baik{ background:var(--berdaya-bg); color:var(--berdaya); }
  .badge.cukup{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.sedang.cap{ background:var(--menengah-bg); color:var(--menengah); }
  .badge.kurang{ background:var(--utama-bg); color:var(--utama); }

  .upload-box{ border:1.5px dashed var(--line-strong); border-radius:5px; padding:26px; text-align:center; background:var(--paper); }
  .upload-box input[type=file]{ display:block; margin:12px auto 0; max-width:320px; }
  .upload-box .fname{ margin-top:10px; font-size:12.5px; color:var(--ink-soft); }
  .upload-msg{ font-size:13px; margin-top:10px; }
  .upload-msg.ok{ color:var(--berdaya); }
  .upload-msg.err{ color:var(--danger); }

  table.indikator{ width:100%; border-collapse:collapse; font-size:13px; margin-bottom:18px; }
  table.indikator th{ text-align:left; font-size:11px; color:var(--ink-soft); font-weight:500; padding:6px 8px; border-bottom:1px solid var(--line-strong); }
  table.indikator td{ padding:8px 8px; border-bottom:1px solid var(--line); }
  .dim-block-title{ font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:var(--pine); font-weight:600; margin:18px 0 6px; }

  .rekom-item{ border:1px solid var(--line-strong); border-radius:4px; padding:14px 16px; margin-bottom:10px; background:#fff; }
  .rekom-item .rekom-head{ display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
  .rekom-item .rekom-title{ font-size:13.5px; font-weight:500; }
  .rekom-item .rekom-akar{ font-size:12px; color:var(--gold); margin-top:2px; }
  .rekom-item .rekom-link{ font-size:12px; margin-top:8px; }
  .rekom-item .rekom-link a{ color:var(--pine-2); }

  .visit-item{ border:1px solid var(--line-strong); border-radius:4px; padding:14px 16px; margin-bottom:10px; background:#fff; }
  .visit-item .visit-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .visit-item .visit-date{ font-family:'Source Serif 4',serif; font-size:15px; color:var(--pine); font-weight:600; }
  .visit-item .visit-jenis{ font-size:11.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.3px; margin-top:2px; }
  .visit-item .visit-body{ font-size:13.5px; color:var(--ink-soft); margin-top:8px; white-space:pre-wrap; }
  .visit-item .visit-tl{ font-size:13px; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); white-space:pre-wrap; }
  .visit-item .visit-tl .lbl{ font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:.3px; margin-bottom:3px; }

  table.rkas{ width:100%; border-collapse:collapse; font-size:13px; }
  table.rkas th{ text-align:left; font-size:11px; letter-spacing:.2px; color:var(--ink-soft); font-weight:500; padding:7px 8px; border-bottom:1px solid var(--line-strong); background:var(--paper); }
  table.rkas td{ padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.rkas td.num{ text-align:right; }
  table.rkas tfoot td{ font-weight:600; border-top:2px solid var(--line-strong); border-bottom:none; padding-top:8px; }
  .rkas-cell-input{ width:100%; border:1px solid transparent; background:transparent; padding:5px 6px; font-family:'Public Sans',sans-serif; font-size:13px; border-radius:3px; }
  .rkas-cell-input:hover{ border-color:var(--line); }
  .rkas-cell-input:focus{ border-color:var(--pine-2); background:#fff; outline:none; }
  select.rkas-cell-input{ padding:5px 4px; }
  .rkas-source-tag{ font-size:10.5px; color:var(--gold); text-transform:uppercase; letter-spacing:.2px; display:block; margin-top:2px; }
  .sumber-summary{ display:flex; gap:16px; flex-wrap:wrap; margin-top:16px; }
  .sumber-summary .box{ background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:10px 16px; min-width:140px; }
  .sumber-summary .box .l{ font-size:11.5px; color:var(--ink-soft); }
  .sumber-summary .box .v{ font-family:'Source Serif 4',serif; font-size:16px; color:var(--pine); font-weight:600; margin-top:2px; }

  .year-select{ padding:6px 8px; font-size:12.5px; border:1px solid var(--line-strong); border-radius:3px; background:#fff; }
  .rkjm-year-group{ margin-bottom:20px; }
  .rkjm-year-title{ font-family:'Source Serif 4',serif; font-size:16px; color:var(--pine); border-bottom:2px solid var(--pine); padding-bottom:6px; margin-bottom:10px; }

  /* buttons/forms */
  .btn{ font-family:'Public Sans',sans-serif; font-size:13.5px; font-weight:500; padding:9px 18px; border-radius:3px; cursor:pointer; border:1px solid var(--pine); background:var(--pine); color:#fff; }
  .btn:hover{ background:var(--pine-2); }
  .btn.secondary{ background:none; color:var(--pine); }
  .btn.secondary:hover{ background:var(--paper); }
  .btn.ghost{ background:none; border-color:var(--line-strong); color:var(--ink-soft); }
  .btn.ghost:hover{ border-color:var(--pine); color:var(--pine); }
  .btn.danger{ background:none; border-color:var(--danger); color:var(--danger); }
  .btn.danger:hover{ background:#fbecea; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

  label.field{ display:block; margin-bottom:14px; }
  label.field span{ display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px; }
  input[type=text], input[type=number], select, textarea{
    width:100%; font-family:'Public Sans',sans-serif; font-size:14px; padding:9px 11px;
    border:1px solid var(--line-strong); border-radius:3px; background:#fff; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:64px; }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--pine-2); outline-offset:1px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 20px; }
  .error-text{ color:var(--danger); font-size:12.5px; margin:-8px 0 12px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--ink-soft); }
  .empty .big{ font-family:'Source Serif 4',serif; font-size:19px; color:var(--pine); margin-bottom:6px; }

  select.school-picker{ max-width:340px; }

  /* reflection question card */
  .question{ border-top:1px solid var(--line); padding:20px 0; }
  .question:first-of-type{ border-top:none; }
  .question .qnum{ font-size:11.5px; color:var(--gold); font-weight:600; letter-spacing:.3px; }
  .question .qtext{ font-family:'Source Serif 4',serif; font-size:16.5px; margin:6px 0 14px; color:var(--ink); }
  .opt{
    display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border:1px solid var(--line);
    border-radius:4px; margin-bottom:8px; cursor:pointer; background:#fff;
  }
  .opt:hover{ border-color:var(--pine-2); }
  .opt.selected{ border-color:var(--pine); background:var(--paper); }
  .opt input{ margin-top:3px; flex:none; }
  .opt .opt-lvl{ font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; display:block; margin-bottom:3px; }
  .opt.selected .opt-lvl{ color:var(--pine); }
  .opt .opt-text{ font-size:13.5px; color:var(--ink-soft); }

  .result-strip{ display:flex; gap:24px; flex-wrap:wrap; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:4px; padding:16px 20px; margin-top:6px; }
  .result-strip .item .l{ font-size:11.5px; color:var(--ink-soft); margin-bottom:3px; }

  /* strategi */
  .strategi-card{ border:1px solid var(--line-strong); border-radius:4px; overflow:hidden; }
  .strategi-head{ background:var(--pine); color:#fff; padding:16px 22px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .strategi-head h3{ margin:0; font-size:17px; font-weight:600; }
  .strategi-body{ padding:18px 22px; background:#fff; }
  .strategi-body p{ margin:0 0 12px; font-size:13.5px; color:var(--ink-soft); }
  .kv-row{ display:flex; gap:30px; margin-bottom:14px; flex-wrap:wrap; }
  .kv-row .kv .l{ font-size:11.5px; color:var(--ink-soft); }
  .kv-row .kv .v{ font-family:'Source Serif 4',serif; font-size:15px; color:var(--pine); }

  /* rkt library */
  .dim-group{ margin-bottom:22px; }
  .dim-title{ font-size:12px; letter-spacing:.3px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-bottom:10px; }
  .prog-item{ border:1px solid var(--line); border-radius:4px; padding:13px 16px; margin-bottom:8px; background:#fff; }
  .prog-item .prog-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:pointer; }
  .prog-item .prog-title{ font-size:14px; font-weight:500; color:var(--ink); }
  .prog-item .steps{ margin:10px 0 0; padding-left:18px; font-size:13px; color:var(--ink-soft); }
  .prog-item .steps li{ margin-bottom:4px; }
  .chk{ flex:none; width:19px; height:19px; margin-top:2px; }

  .selected-list .row{ display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); gap:10px; }
  .selected-list .row .t{ font-size:13.5px; }
  .remove-x{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:16px; line-height:1; padding:4px; }
  .remove-x:hover{ color:var(--danger); }

  .report{ background:#fff; border:1px solid var(--line-strong); border-radius:4px; padding:30px 34px; font-family:'Source Serif 4',serif; font-size:14.5px; line-height:1.75; color:var(--ink); }
  .report h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--gold); font-family:'Public Sans',sans-serif; font-weight:600; margin:22px 0 8px; }
  .report h3:first-child{ margin-top:0; }
  .report p{ margin:0 0 10px; }
  .report ol{ margin:0 0 10px; padding-left:20px; }
  .report .rpt-title{ font-size:19px; font-weight:600; margin-bottom:2px; }
  .report .rpt-sub{ font-family:'Public Sans',sans-serif; font-size:12.5px; color:var(--ink-soft); margin-bottom:18px; }

  .modal-overlay{ position:absolute; inset:0; background:rgba(24,43,34,.45); display:flex; align-items:flex-start; justify-content:center; padding:60px 20px; z-index:50; }
  .modal{ background:#fff; border-radius:5px; padding:26px 28px; max-width:460px; width:100%; box-shadow:0 12px 30px rgba(0,0,0,.2); }
  .modal h3{ margin:0 0 16px; font-size:17px; color:var(--pine); }
  .rel-wrap{ position:relative; }

  @media print{
    .no-print{ display:none !important; }
    body{ background:#fff; }
    .panel{ border:none; padding:0; }
    .tw-section{ page-break-before:always; }
    .tw-section:first-of-type{ page-break-before:auto; }
  }
  @media (max-width:720px){
    .grid2{ grid-template-columns:1fr; }
    .kv-row{ gap:16px; }
  }

  /* RKJP sheet (format tabel template) */
  table.rkjp-sheet{ width:100%; border-collapse:collapse; font-size:13px; background:#fff; table-layout:fixed; min-width:980px; }
  table.rkjp-sheet th, table.rkjp-sheet td{ border:1px solid #000; padding:3px 5px; vertical-align:top; text-align:left; }
  table.rkjp-sheet th{ font-weight:700; background:#fff; }
  table.rkjp-sheet th .hint{ display:block; font-weight:400; font-style:italic; color:#555; margin-top:2px; font-size:12.5px; }
  table.rkjp-sheet tr.contoh td{ background:#efefef; font-style:italic; color:#333; }
  table.rkjp-sheet td.no{ text-align:left; width:34px; }
  table.rkjp-sheet textarea{ border:none!important; background:transparent!important; padding:2px!important; min-width:0!important; resize:vertical; font-size:13px!important; }
  table.rkjp-sheet select{ width:100%; border:none; background:transparent; font:inherit; }
  table.rkjp-sheet td.aksi{ width:86px; border:none; padding-left:8px; white-space:nowrap; }
  table.rkjp-sheet td.aksi button{ padding:2px 8px; font-size:12px; margin-bottom:3px; display:block; }
  table.rkjp-ident{ border-collapse:collapse; width:100%; font-size:13px; margin-bottom:18px; background:#fff; }
  table.rkjp-ident td{ border:1px solid #000; padding:3px 6px; }
  table.rkjp-ident td:first-child{ width:250px; font-weight:700; }
  .rkjp-addrow{ margin:10px 0 0; }

  table.rkjp-sheet input{ width:100%!important; border:none!important; background:transparent!important; font:inherit; font-size:13px!important; padding:2px!important; min-width:0; }
  table.rkjp-sheet input[type=number]{ -moz-appearance:textfield; }
  table.rkjp-sheet input[type=number]::-webkit-outer-spin-button, table.rkjp-sheet input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  table.rkjp-sheet td.tot{ white-space:normal; word-break:break-word; }
  table.rkjp-sheet tfoot td{ font-weight:700; background:#fafafa; }
  .sheet-note{ text-align:center; font-style:italic; color:#666; font-size:12.5px; margin-top:12px; }
  @page{ size:legal landscape; margin:1.2cm; }
  @media print{
    .app{ max-width:none !important; padding:0 !important; }
    div[style*="overflow-x:auto"]{ overflow:visible !important; }
    table.rkjp-sheet{ min-width:0 !important; font-size:11px; }
    table.rkjp-sheet input, table.rkjp-sheet textarea, table.rkjp-sheet select{ font-size:11px !important; }
    table.rkjp-sheet tr, table.rkjp-ident tr{ page-break-inside:avoid; }
    table.rkjp-sheet thead{ display:table-header-group; }
  }
  /* teks tabel lebih hitam agar mudah terbaca */
  table td, table th{ color:#000; }
  table.roster th, table.indikator th{ color:#111; font-weight:600; }
  table.rkjp-sheet th .hint{ color:#222; }
  table input, table textarea, table select{ color:#000; }
  table input:disabled, table textarea:disabled, table select:disabled{ color:#000; -webkit-text-fill-color:#000; opacity:1; }
  table.rkjp-sheet tr.contoh td{ color:#000; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){

var STORAGE_KEY = 'pendampingan-sekolah-binaan-app-data-v2-7m4x9p';

var KESADARAN_Q = [
  { id:'k1', pemantik:'Apakah kepala sekolah mengakui kelemahan satuan pendidikan apa adanya dan menjelaskan dampaknya terhadap kualitas pembelajaran?',
    berkembang:'Belum mengakui kelemahan apa adanya dan belum menjelaskan dampaknya pada kualitas pembelajaran.',
    berdaya:'Mengakui kelemahan apa adanya dan menjelaskan dampaknya pada kualitas pembelajaran.' },
  { id:'k2', pemantik:'Apakah kepala sekolah mengetahui dan menunjukkan keinginan mengoptimalkan kekuatan satuan pendidikan?',
    berkembang:'Belum mengetahui dan belum menunjukkan keinginan mengoptimalkan kekuatan satuan pendidikan.',
    berdaya:'Mengetahui dan menunjukkan keinginan mengoptimalkan kekuatan satuan pendidikan.' }
];

var KAPASITAS_Q = [
  { id:'p1', pemantik:'Bagaimana kepala sekolah menyusun program kerja dan anggaran satuan pendidikan?',
    rendah:'Tidak melakukan perubahan program/kegiatan apa pun dalam 3 tahun terakhir (monoton).',
    sedang:'Melakukan perubahan program/kegiatan dalam 3 tahun terakhir, tetapi belum efektif.',
    tinggi:'Melakukan perubahan program/kegiatan dalam 3 tahun terakhir yang berdampak.' },
  { id:'p2', pemantik:'Apakah perubahan program/kegiatan tersebut didasarkan pada perencanaan berbasis data?',
    rendah:'Belum mampu menjelaskan perubahan berdasarkan perencanaan berbasis data.',
    sedang:'Mampu menjelaskan perubahan berdasarkan perencanaan berbasis data.',
    tinggi:'Mampu menjelaskan dan mencoba perubahan berdasarkan perencanaan berbasis data.' }

function fixSheetRange(sheet){
  if(!sheet) return sheet;
  var maxR = 0, maxC = 0;
  Object.keys(sheet).forEach(function(key){
    if(key.charAt(0) === '!') return;
    var m = key.match(/^([A-Z]+)(\d+)$/);
    if(!m) return;
    var col = 0;
    for(var i=0;i<m[1].length;i++){ col = col*26 + (m[1].charCodeAt(i)-64); }
    col -= 1;
    var row = parseInt(m[2],10) - 1;
    if(row > maxR) maxR = row;
    if(col > maxC) maxC = col;
  });
  sheet['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:maxR,c:maxC} });
  return sheet;
}

function findSheet(workbook, needle){
  var names = workbook.SheetNames;
  for(var i=0;i<names.length;i++){
    if(names[i].toUpperCase().indexOf(needle) > -1) return fixSheetRange(workbook.Sheets[names[i]]);
  }
  return null;
}

function cellText(v){
  if(v === undefined || v === null) return '';
  return String(v).trim();
}

function parseIndikator(sheet){
  if(!sheet) return [];
  var rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
  var out = [];
  var codeRe = /^[A-Z]\.\d+$/;
  rows.forEach(function(row){
    var kode = cellText(row[0]);
    if(!codeRe.test(kode)) return;
    var namaFull = cellText(row[1]);
    var nama = namaFull.split('\n')[0];
    var capaian = cellText(row[2]);
    var skor = cellText(row[3]);
    if(!nama) return;
    out.push({ kode:kode, dimensi:kode.charAt(0), nama:nama, capaian:capaian, skor:skor });
  });
  return out;
}

function splitLangkah(text){
  if(!text) return [];
  var parts = text.split(/\n\s*\n/).map(function(p){ return p.trim(); }).filter(Boolean);
  return parts.map(function(p){
    return p.replace(/^\d+\.\s*Inspirasi\s*\d+\s*:\s*/i, '').replace(/^\d+\.\s*/, '').trim();
  });
}

function parseRekomendasi(sheet){
  if(!sheet) return [];
  var rows = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'' });
  var out = [];
  var headerFound = false;
  for(var i=0;i<rows.length;i++){
    var row = rows[i];
    var a = cellText(row[0]);
    if(!headerFound){
      if(a.toLowerCase() === 'no') headerFound = true;
      continue;
    }
    if(a === '' && cellText(row[1]) === '') continue;
    if(!/^\d+$/.test(a)) continue;
    var indikator = cellText(row[1]);
    var capaian = cellText(row[2]);
    var skor = cellText(row[3]);
    var akarLv1 = cellText(row[4]);
    var akarLv2 = cellText(row[5]);
    var benahi = cellText(row[6]);
    var inspirasi = cellText(row[7]);
    var link = cellText(row[8]);
    var arkas = cellText(row[9]);
    if(!indikator) continue;
    out.push({
      id:uid(), indikator:indikator, capaian:capaian, skor:skor,
      akarMasalah: akarLv2 || akarLv1, benahi:benahi,
      langkah: splitLangkah(inspirasi), link:link, arkas:arkas
    });
  }
  return out;
}

function parseRaporWorkbook(workbook){
  var lapSheet = findSheet(workbook, 'LAPORAN RAPOR');
  var rekomSheet = findSheet(workbook, 'REKOM. PRIORITAS') || findSheet(workbook, 'REKOMENDASI PRIORITAS') || findSheet(workbook, 'REKOM PRIORITAS');
  var indikator = parseIndikator(lapSheet);
  var rekomendasi = parseRekomendasi(rekomSheet);
  var tahun = '';
  if(lapSheet){
    var a1 = cellText(lapSheet['A1'] && lapSheet['A1'].v);
    var m = a1.match(/TAHUN\s+(\d{4})/i);
    if(m) tahun = m[1];
  }
  var rekomAll = [];
  workbook.SheetNames.forEach(function(nm){
    var u = nm.toUpperCase();
    if(rekomAll.length || u.indexOf('REKOM') < 0 || u.indexOf('PRIORITAS') > -1) return;
    rekomAll = parseRekomendasi(fixSheetRange(workbook.Sheets[nm]));
  });
  return { tahun:tahun, indikator:indikator, rekomendasi:rekomendasi, rekomAll:rekomAll, parsedAt:new Date().toISOString() };
}

        langkah:['Kepala satuan pendidikan dan pendidik meningkatkan kompetensi dengan mempelajari tentang pendidikan karakter yang berkaitan dengan menumbuhkan kemauan dan kebiasaan mengambil keputusan secara logis berdasarkan berbagai bukti dan sudut pandang yang beragam pada diri peserta didik melalui pelatihan, diskusi pada komunitas belajar, belajar mandiri memanfaatkan berbagai sumber belajar, dan kegiatan lain yang menunjang peningkatan kompetensi. Inspirasi benahi ini mendukung pencapaian standar kompetensi lulusan melalui peningkatan standar proses dan standar PTK', 'Kepala satuan pendidikan dan pendidik merencanakan dan mengimplementasikan pembelajaran yang menumbuhkan sikap pengambilan keputusan secara logis melalui intrakurikuler, kokurikuler, dan/atau ekstrakurikuler untuk mendukung pengembangan pendidikan karakter. Inspirasi benahi ini mendukung pencapaian standar kompetensi lulusan melalui peningkatan standar proses dan standar pengelolaan', 'Kepala satuan pendidikan mendorong perbaikan dimensi Nalar Kritis melalui program dan kebijakan di satuan pendidikan, baik yang membutuhkan anggaran dan yang tidak membutuhkan anggaran untuk mendukung pengembangan pendidikan karakter. Inspirasi benahi ini mendukung pencapaian standar kompetensi lulusan melalui peningkatan standar pengelolaan dan standar pembiayaan'],

function normalizeSchool(s){
  if(!s.rkt) s.rkt = [];
  if(!s.rkjm) s.rkjm = [];
  if(!s.rkjp) s.rkjp = [];
  if(!s.rkas) s.rkas = [];
  if(s.rapor === undefined) s.rapor = null;
  if(!s.kesadaranJawaban) s.kesadaranJawaban = {};
  if(!s.kapasitasJawaban) s.kapasitasJawaban = {};
  if(s.catatan === undefined) s.catatan = '';
  if(!s.kunjungan) s.kunjungan = [];
  if(s.npsn === undefined) s.npsn = '';
  if(s.jenjang === undefined) s.jenjang = '';
  if(s.laporanNomor === undefined) s.laporanNomor = '';
  if(s.laporanTanggal === undefined) s.laporanTanggal = '';
  return s;
}

function triwulanFilterSelect(currentValue, onSelect){
  var sel = el('select',{class:'year-select'});
  TRIWULAN_OPTIONS.forEach(function(o){
    var opt = el('option',{value:o.value},[o.label]);
    if(String(currentValue) === o.value) opt.setAttribute('selected','selected');
    sel.appendChild(opt);
  });
  sel.addEventListener('change', function(){ onSelect(sel.value); });
  return sel;
}

function kesadaranLevel(s){
  var vals = KESADARAN_Q.map(function(q){ return s.kesadaranJawaban[q.id]; });
  var answered = vals.filter(Boolean);
  if(answered.length < KESADARAN_Q.length) return null;
  return vals.indexOf('berdaya') > -1 ? 'Berdaya' : 'Berkembang';
}
function kapasitasLevel(s){
  var vals = KAPASITAS_Q.map(function(q){ return s.kapasitasJawaban[q.id]; });
  var answered = vals.filter(Boolean);
  if(answered.length < KAPASITAS_Q.length) return null;
  var order = ['rendah','sedang','tinggi'];
  var best = -1;
  vals.forEach(function(v){ var i = order.indexOf(v); if(i>best) best=i; });
  return best>=0 ? (order[best].charAt(0).toUpperCase()+order[best].slice(1)) : null;
}
function strategiFor(s){
  if(s.strategiManual) return s.strategiManual;
  var kes = kesadaranLevel(s), kap = kapasitasLevel(s);
  if(!kes || !kap) return null;
  var m = MATRIX[kes + '|' + kap];
  if(!m) return null;

var LOCAL_KEY = STORAGE_KEY;

function showSaveWarning(msg){
  state.saveWarning = msg;

}
function clearSaveWarning(){
  if(!state.saveWarning) return;

  var box = document.getElementById('save-warning-box');

function localSave(){
  try{
    window.localStorage.setItem(LOCAL_KEY, JSON.stringify(state.data));
    return true;
  }catch(e){ console.error('localStorage save failed', e); return false; }
}
function localLoad(){
  try{
    var raw = window.localStorage.getItem(LOCAL_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ console.error('localStorage load failed', e); return null; }
}

function doSaveOld(){
  if(hasCloudStorage){

        else clearSaveWarning();
      }).catch(function(e){

        else clearSaveWarning();
      });
    }catch(e){

  state.saveTimer = setTimeout(doSave, 250);
}
function flushSave(){
  if(state.saveTimer){ clearTimeout(state.saveTimer); state.saveTimer = null; doSave(); }
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'hidden') flushSave(); });
window.addEventListener('pagehide', flushSave);
window.addEventListener('beforeunload', flushSave);
function loadOld(){
  if(hasCloudStorage){
    try{
      window.storage.get(STORAGE_KEY, false).then(function(res){
        if(res && res.value){
          applyLoadedData(res.value);
        } else {
          var local = localLoad();
          if(local) applyLoadedObject(local);
        }
        state.loading = false;
        render();
      }).catch(function(){
        var local = localLoad();
        if(local) applyLoadedObject(local);
        state.loading = false;
        render();
      });

      if(local) applyLoadedObject(local);

function applyLoadedObject(parsed){
  state.data = {

    extraYears: (parsed && Array.isArray(parsed.extraYears)) ? parsed.extraYears : []
  };
}

function el(tag, attrs, children){
  var node = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(function(k){
    var v = attrs[k];
    if(v === null || v === undefined) return;
    if(k === 'html'){ node.innerHTML = v; }
    else if(k.indexOf('on') === 0){ node.addEventListener(k.slice(2).toLowerCase(), v); }
    else if(k === 'class'){ node.className = v; }
    else { node.setAttribute(k, v); }
  });
  (children||[]).forEach(function(c){ if(c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return node;
}
function text(t){ return document.createTextNode(t); }

function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- Rapor Pendidikan ---------- */
function capaianClass(cap){
  var c = (cap||'').toLowerCase();
  if(c.indexOf('baik') > -1) return 'baik';
  if(c.indexOf('sedang') > -1 || c.indexOf('cukup') > -1) return 'sedang cap';
  if(c.indexOf('kurang') > -1) return 'kurang';
  return 'muted';
}

/* ---------- RKT ---------- */
function rekomToLib(r){
  return { dimensi:r.indikator, judul:r.akarMasalah || r.indikator,
    langkah: r.langkah.length ? r.langkah : (r.benahi ? [r.benahi] : []) };
}

function addProgramToList(s, listKey, item, sourceKey, withYear){
  var entry = { id:uid(), dimensi:item.dimensi, judul:item.judul, langkah:item.langkah.slice(), custom:false, sourceKey:sourceKey };
  if(withYear) entry.tahun = 1;
  if(listKey === 'rkt') entry.triwulan = null;
  s[listKey].push(entry);
}

  if(!s.rapor || !s.rapor.rekomendasi.length) return null;

  s.rapor.rekomendasi.forEach(function(r, i){
    var sourceKey = 'rapor:'+r.id;
    var libItem = rekomToLib(r);
    var already = s[listKey].some(function(x){ return x.sourceKey === sourceKey; });
    var box = el('div',{class:'prog-item'});
    var chk = el('input',{class:'chk', type:'checkbox', checked: already?'checked':null, onchange:function(){
      if(chk.checked){ addProgramToList(s, listKey, libItem, sourceKey, listKey==='rkjm'); }
      else { s[listKey] = s[listKey].filter(function(x){ return x.sourceKey !== sourceKey; }); }
      save(); render();
    }});
    var headRow = el('div',{class:'prog-head'},[
      chk,
      el('div',{style:'flex:1'},[
        el('div',{class:'prog-title'},[(i+1)+'. '+r.indikator+' \u2014 '+r.akarMasalah]),
      ])
    ]);

/* ---------- RKA / RKAS ---------- */
var SUMBER_DANA = ['BOS Reguler', 'BOP Kinerja', 'BOSDA', 'Komite Sekolah', 'APBD', 'Lainnya'];

function rupiah(n){
  n = Number(n)||0;
  return 'Rp' + n.toLocaleString('id-ID');
}

function rkasTotal(row){ return (Number(row.volume)||0) * (Number(row.hargaSatuan)||0); }

function addRkasRow(s, data){
  if(!s.rkas) s.rkas=[];
  s.rkas.push(Object.assign({ id:uid(), kegiatan:'', komponen:'', sumberDana:'BOS Reguler', volume:1, satuan:'paket', hargaSatuan:0, sourceKey:null, triwulan:null }, data));
}

var BULAN_ID=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function raporRekom(sc,id){ var r=sc.rapor||{}; return (r.rekomendasi||[]).concat(r.rekomAll||[]).filter(function(x){ return x.id===id; })[0]; }
function arkasNames(r){
  if(!r||!r.arkas) return [];
  var lines=r.arkas.split(/\r?\n/).map(function(l){ return l.trim(); }).filter(Boolean);
  var dash=lines.filter(function(l){ return l.charAt(0)==='-'; }).map(function(l){ return l.replace(/^-+\s*/,''); });
  return dash.length?dash:lines.slice(0,1);
}
function rkasRowEmpty(r){ return !(r.uraian||r.bulan||r.volume||r.hargaSatuan||r.satuan); }
/* Sinkronisasi RKJP -> ARKAS: baris ARKAS bertanda sourceKey "rkjp:<id>" mengikuti
   rincian kegiatan RKJP yang berbiaya "Ya". Kolom anggaran (uraian, bulan, jumlah,
   satuan, harga) milik pengguna dan tidak pernah ditimpa. */
function arkasSync(sc, opts){
  opts=opts||{};
  if(!sc.rkas) sc.rkas=[]; if(!sc.rkjp) sc.rkjp=[];
  if(!sc.rkasIgnored) sc.rkasIgnored=[];
  if(opts.reset) sc.rkasIgnored=[];
  var st={added:0,updated:0,removed:0,orphan:0};
  var want={}, order=[];
  sc.rkjp.forEach(function(it){
    var rid=(it.sourceKey&&it.sourceKey.indexOf('rapor:')===0)?it.sourceKey.slice(6):null;
    var nm=arkasNames(rid?raporRekom(sc,rid):null);
    (it.impl||[]).forEach(function(im){
      if(im.biaya!=='Ya' || !(im.uraian||it.kegiatan||it.indikator)) return;
      var key='rkjp:'+im.id;
      want[key]={benahi:it.kegiatan||it.indikator||'', impl:im.uraian||'', kegiatan:nm[0]||'', rid:rid};
      if(order.indexOf(key)<0) order.push(key);
    });
  });
  sc.rkasIgnored=sc.rkasIgnored.filter(function(k){ return !!want[k]; });
  var keep=[], seen={};
  var covered={};
  Object.keys(want).forEach(function(k){ if(want[k].rid) covered[want[k].rid]=1; });
  sc.rkas.forEach(function(r){
    /* baris lama hasil isian langsung dari Rapor (rapor:<id>) yang sudah tercakup RKJP dan belum diisi anggarannya: duplikat, dibuang */
    if(r.sourceKey&&r.sourceKey.indexOf('rapor:')===0&&covered[r.sourceKey.slice(6)]&&rkasRowEmpty(r)){ st.removed++; return; }
    if(!r.sourceKey||r.sourceKey.indexOf('rkjp:')!==0){ keep.push(r); return; }
    var w=want[r.sourceKey];
    if(w && !seen[r.sourceKey]){
      seen[r.sourceKey]=1;
      var ch=false;
      if(r.srcBenahi!==w.benahi && r.benahi!==w.benahi){ r.benahi=w.benahi; ch=true; }
      if(r.srcImpl!==w.impl && r.implementasi!==w.impl){ r.implementasi=w.impl; ch=true; }
      r.srcBenahi=w.benahi; r.srcImpl=w.impl;
      if(!r.kegiatan && w.kegiatan){ r.kegiatan=w.kegiatan; ch=true; }
      if(!r.raporId && w.rid){ r.raporId=w.rid; ch=true; }
      if(r.orphan){ r.orphan=false; ch=true; }
      if(ch) st.updated++;
      keep.push(r);
    } else if(w){ st.removed++; }   /* duplikat */
    else if(rkasRowEmpty(r)){ st.removed++; }
    else { if(!r.orphan){ r.orphan=true; st.updated++; } keep.push(r); }
  });
  sc.rkas=keep;
  order.forEach(function(k){
    if(seen[k]||sc.rkasIgnored.indexOf(k)>=0) return;
    seen[k]=1;
    var w=want[k];
    addRkasRow(sc,{benahi:w.benahi,implementasi:w.impl,kegiatan:w.kegiatan,raporId:w.rid,sourceKey:k,srcBenahi:w.benahi,srcImpl:w.impl,sumberDana:'',volume:'',satuan:''});
    st.added++;
  });
  /* urutan baris tertaut mengikuti urutan RKJP; baris manual tetap di posisinya */
  var slots=[], linked=[];
  sc.rkas.forEach(function(r,i){ if(r.sourceKey&&want[r.sourceKey]){ slots.push(i); linked.push(r); } });
  linked.sort(function(x,y){ return order.indexOf(x.sourceKey)-order.indexOf(y.sourceKey); });
  var moved=false;
  slots.forEach(function(pos,i){ if(sc.rkas[pos]!==linked[i]){ moved=true; sc.rkas[pos]=linked[i]; } });
  st.moved=moved;
  st.orphan=sc.rkas.filter(function(r){ return r.orphan; }).length;
  st.changed=!!(st.added||st.updated||st.removed||moved);
  return st;
}

/* ---------- Laporan Triwulanan ---------- */
var BULAN_ID = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
var TRIWULAN_LABEL = {
  1: { roman:'I', rentang:'Januari \u2013 Maret' },
  2: { roman:'II', rentang:'April \u2013 Juni' },
  3: { roman:'III', rentang:'Juli \u2013 September' },
  4: { roman:'IV', rentang:'Oktober \u2013 Desember' }
};

function parseTanggalIndo(str){
  if(!str) return null;
  var low = String(str).toLowerCase();
  var yearMatch = low.match(/\b(19|20)\d{2}\b/);
  if(!yearMatch) return null;
  var year = parseInt(yearMatch[0], 10);
  var monthIdx = -1;
  for(var i=0;i<BULAN_ID.length;i++){
    if(low.indexOf(BULAN_ID[i]) > -1){ monthIdx = i; break; }
  }
  if(monthIdx === -1){
    var m = low.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
    if(m){
      var mm = parseInt(m[2],10);
      if(mm>=1 && mm<=12){ monthIdx = mm-1; }
    } else {
      var m2 = low.match(/\b(\d{4})-(\d{1,2})-(\d{1,2})\b/);
      if(m2){ var mm2 = parseInt(m2[2],10); if(mm2>=1 && mm2<=12) monthIdx = mm2-1; }
    }
  }
  if(monthIdx === -1) return null;
  var dayMatch = low.match(/\b(\d{1,2})\b/);
  var day = dayMatch ? parseInt(dayMatch[0],10) : 1;
  return { day:day, month:monthIdx, year:year };
}
function triwulanOfMonth(month){ return Math.floor(month/3) + 1; }

function collectTriwulanYears(){
  var years = {};
  state.data.schools.forEach(function(s){
    s.kunjungan.forEach(function(v){
      var d = parseTanggalIndo(v.tanggal);
      if(d) years[d.year] = true;
    });
  });
  var arr = Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
  if(arr.length === 0) arr.push(new Date().getFullYear());
  return arr;
}

function selectableYears(){
  var years = {};
  collectTriwulanYears().forEach(function(y){ years[y] = true; });
  var now = new Date().getFullYear();
  for(var y = now-2; y <= now+3; y++){ years[y] = true; }
  (state.data.extraYears||[]).forEach(function(y){ years[Number(y)] = true; });
  return Object.keys(years).map(Number).sort(function(a,b){ return b-a; });
}

function addYearControl(onAdded){
  var wrap = el('span',{style:'display:inline-flex;gap:4px;align-items:center'});
  var input = el('input',{type:'number', placeholder:'Tahun lain', style:'width:100px;padding:6px 8px;border:1px solid var(--line-strong);border-radius:3px;font-family:\'Public Sans\',sans-serif;font-size:13px'});
  var btn = el('button',{class:'btn ghost', type:'button', style:'padding:6px 10px', onclick:function(){
    var y = parseInt(input.value,10);
    if(!y || y < 1900 || y > 3000) return;
    if(!state.data.extraYears) state.data.extraYears = [];
    if(state.data.extraYears.indexOf(y) === -1) state.data.extraYears.push(y);
    input.value = '';
    save();
    onAdded(y);
  }},['+ Tahun']);
  wrap.appendChild(input);
  wrap.appendChild(btn);
  return wrap;
}

}

}

function rkjpHapusKosong(sc){
  var n=0;
  sc.rkjp=(sc.rkjp||[]).filter(function(it){
    var impl=it.impl||[];
    var ada=it.indikator||it.akar||it.kegiatan||impl.some(function(im){ return im.uraian||im.biaya; });
    if(!ada){ n++; return false; }
    if(impl.length>1){ var isi=impl.filter(function(im){ return im.uraian||im.biaya; }); if(isi.length&&isi.length<impl.length){ n+=impl.length-isi.length; it.impl=isi; } }
    return true;
  });
  return n;
}
function rkjpSig(it){ return [it.indikator,it.akar,it.kegiatan].concat((it.impl||[]).map(function(im){ return im.uraian+'|'+im.biaya; })).join('\u00a6'); }
/* Mengisi sel kosong dengan contoh kebutuhan sekolah dan menambah baris prioritas sampai 10 baris. */
function rkjpContoh(sc,total){
  total=total||10; if(!sc.rkjp) sc.rkjp=[];
  var n=0;
  sc.rkjp.forEach(function(it,i){
    var e=RKJP_EX[i%RKJP_EX.length]; it._ex=it._ex||{};
    ['indikator','akar','kegiatan'].forEach(function(k){ if(!it[k]){ it._ex[k]=e[k]; it[k]=e[k]; n++; } });
    (it.impl||[]).forEach(function(im,j){
      var s=e.impl[j%e.impl.length]; im._ex=im._ex||{};
      if(!im.uraian){ im._ex.uraian=s[0]; im.uraian=s[0]; n++; }
      if(!im.biaya){ im._ex.biaya=s[1]; im.biaya=s[1]; n++; }
      if(!Object.keys(im._ex).length) delete im._ex;
    });
    if(!Object.keys(it._ex).length) delete it._ex;
  });
  while(sc.rkjp.length<total){
    var e2=RKJP_EX[sc.rkjp.length%RKJP_EX.length];
    rkjpAddFrom(sc,{indikator:e2.indikator,akar:e2.akar,kegiatan:e2.kegiatan,langkah:e2.impl.map(function(s){ return s[0]; })});
    var nw=sc.rkjp[sc.rkjp.length-1]; nw.impl.forEach(function(im,j){ im.biaya=e2.impl[j][1]; });
    nw.contoh=rkjpSig(nw); n+=3+e2.impl.length*2;
  }
  return n;
}
function rkjpHapusContoh(sc){
  var n=0;
  sc.rkjp=(sc.rkjp||[]).filter(function(it){
    if(it.contoh){ if(rkjpSig(it)===it.contoh){ n++; return false; } delete it.contoh; }
    if(it._ex){ Object.keys(it._ex).forEach(function(k){ if(it[k]===it._ex[k]){ it[k]=''; n++; } }); delete it._ex; }
    (it.impl||[]).forEach(function(im){ if(im._ex){ Object.keys(im._ex).forEach(function(k){ if(im[k]===im._ex[k]){ im[k]=''; n++; } }); delete im._ex; } });
    return true;
  });
  return n;
}
function rkjpHasContoh(sc){ return (sc.rkjp||[]).some(function(it){ return it.contoh||it._ex||(it.impl||[]).some(function(im){ return im._ex; }); }); }
function rkjpHasContent(sc){ return (sc.rkjp||[]).some(function(it){ return it.indikator||it.akar||it.kegiatan||it.impl.some(function(im){ return im.uraian||im.biaya; }); }); }

  return c;
}

  if(ROLE==='pengawas'){
    var ids={};
    state.data.schools.forEach(function(sc){ ids[sc.id]=1; put('schools/'+sc.id,schoolDoc(sc)); if(sc.kepsekUid) put('edits/'+sc.kepsekUid,{schoolId:sc.id,school:sc}); });
    Object.keys(synced).forEach(function(pt){ if(pt.indexOf('schools/')===0 && !ids[pt.slice(8)]){ delete synced[pt]; jobs.push(dbx.doc(pt).delete()); } });
    put('meta/app',{profile:state.data.profile,triwulanMeta:state.data.triwulanMeta,extraYears:state.data.extraYears});
  } else if(ROLE==='kepsek'){ var sc0=state.data.schools[0]; if(sc0) put('edits/'+myId,{schoolId:sc0.id,school:sc0}); }
  Promise.all(jobs).then(clearSaveWarning).catch(function(e){ console.error(e); synced={}; showSaveWarning('Gagal menyimpan ke penyimpanan bersama. Periksa koneksi, lalu ubah sesuatu agar dicoba lagi.'); });
}
function loadNames(){
  var ids=state.data.schools.map(function(sc){return sc.kepsekUid;}).filter(Boolean);
  if(!ids.length||!ux) return Promise.resolve();
  return ux.profiles(ids).then(function(ps){ ids.forEach(function(i){ names[i]=(ps[i]&&ps[i].name)||'Akun terhubung'; }); }).catch(function(){});
}
function assignCell(sc){
  var nm=sc.kepsekUid?(names[sc.kepsekUid]||'Akun terhubung'):null;
  if(ROLE!=='pengawas'||!nm) return el('td',{},[nm||'Belum memilih']);
  return el('td',{},[nm+' ',el('button',{class:'btn secondary',style:'padding:3px 10px;font-size:12px',title:'Lepas akun agar operator dapat memilih sekolah lain',onclick:function(ev){ ev.stopPropagation();
    if(!confirm('Hapus akun operator dari "'+sc.nama+'"? Operator tersebut kehilangan akses, data sekolah tetap tersimpan, dan operator baru dapat memilih sekolah ini.')) return;
    var u=sc.kepsekUid; delete sc.kepsekUid; save(); if(dbx){ dbx.doc('edits/'+u).delete(); dbx.doc('claims/'+u).delete().then(function(){ render(); }); } render(); }},['Hapus akun'])]);
}
function renderPilih(){
  var app=document.getElementById('app'); app.innerHTML=''; app.appendChild(renderMasthead());
  var p=el('div',{class:'panel'}); p.appendChild(el('h2',{},['Pilih sekolah Anda']));
  p.appendChild(el('p',{class:'sub'},['Pilih sekolah tempat Anda bertugas sebagai operator (Tim Kerja). Setelah dipilih, Anda hanya dapat mengisi data sekolah tersebut. Pilihan hanya dapat diubah oleh pengawas.']));
  var q=el('input',{type:'text',placeholder:'Cari nama sekolah\u2026',style:'max-width:360px;margin-bottom:12px'}), box=el('div',{style:'display:flex;flex-direction:column;gap:8px'});
  var free=state.data.schools;
  function draw(){ box.innerHTML=''; var f=q.value.trim().toLowerCase(); var l=free.filter(function(s){ return !f||(s.nama||'').toLowerCase().indexOf(f)>-1; });
    if(!l.length) box.appendChild(el('div',{style:'font-size:13px;color:var(--ink-soft)'},[free.length?'Tidak ada sekolah yang cocok.':'Belum ada sekolah yang tersedia. Hubungi pengawas.']));
    l.forEach(function(s){ box.appendChild(el('button',{class:'btn secondary',style:'text-align:left'+(s.kepsekUid?';opacity:.55':''),onclick:function(){ if(s.kepsekUid){ alert('Sekolah ini sudah memiliki operator. Pendaftaran Anda ditolak kecuali pengawas menghapus akun operator sebelumnya.'); return; } if(confirm('Pilih "'+s.nama+'" sebagai sekolah Anda? Pilihan hanya dapat diubah oleh pengawas.')) claimSchool(s); }},[s.nama+(s.jenjang?' \u00b7 '+s.jenjang:'')+(s.kecamatan?' \u00b7 '+s.kecamatan:'')+(s.kepsekUid?' \u2014 sudah ada operator':'')])); }); }
  q.addEventListener('input',draw); draw(); p.appendChild(q); p.appendChild(box); app.appendChild(p);
}
function claimSchool(sc){
  dbx.collection('claims').get().then(function(snap){
    if(snap.docs.some(function(d){ return d.data().schoolId===sc.id && d.id!==myId; })){ alert('Sekolah ini sudah memiliki operator. Pendaftaran ditolak kecuali pengawas menghapus akun operator sebelumnya.'); location.reload(); return; }
    var n=nz(JSON.parse(JSON.stringify(sc)),myId), payload=JSON.parse(JSON.stringify({schoolId:n.id,school:n}));
    return dbx.doc('edits/'+myId).set(payload).then(function(){ return dbx.doc('claims/'+myId).set({schoolId:n.id}); }).then(function(){
      synced['edits/'+myId]=canon(payload); state.data.schools=[n]; state.activeSchoolId=n.id; state.tab='rapor'; ROLE='kepsek'; names[myId]=names[myId]||'Akun Anda'; loadNames().then(render); render();
    });
  }).catch(function(e){ console.error(e); alert('Gagal memilih sekolah. Periksa koneksi lalu coba lagi.'); });
}
function applyRole(){
  var app=document.getElementById('app');
  if(ROLE==='pilih'){ renderPilih(); return; }
  if(ROLE==='wait'){ app.innerHTML=''; app.appendChild(renderMasthead()); app.appendChild(el('div',{class:'panel'},[el('h2',{},['Akses belum diberikan']),el('p',{class:'sub'},['Akun Anda belum memiliki izin menulis. Minta pengawas menambahkan Anda sebagai Contributor, lalu muat ulang halaman ini.'])])); return; }
  if(!RO()) return;
  app.querySelectorAll('input,select,textarea,button').forEach(function(n){
    if(n.closest('.stepper,.masthead,.saran-panel')) return;
    if(n.classList.contains('school-picker')||n.classList.contains('year-select')) return;
    if(/cari/i.test(n.placeholder||'')) return;
    if(n.tagName==='BUTTON'&&/cetak|print|salin|unduh|ekspor/i.test(n.textContent||'')) return;
    n.disabled=true;
  });
}
function metaOf(meta){ var d=defaultData(); return { profile:Object.assign({},d.profile,(meta&&meta.profile)||{}), triwulanMeta:(meta&&meta.triwulanMeta)||{}, extraYears:(meta&&meta.extraYears)||[] }; }
function boot(){
  var guard=null;
  Promise.resolve().then(function(){ var ok=window.claude&&typeof window.claude.use==='function'; return Promise.all([ok?window.claude.use('user'):null, ok?window.claude.use('db'):null]); }).then(function(r){ ux=r[0]; dbx=r[1]; return start(); }).catch(function(e){ console.error(e); dbx=null; loadOld(); });
  function start(){
    if(!dbx||!ux){ dbx=null; loadOld(); return; }
    guard=setTimeout(function(){ if(state.loading){ dbx=null; loadOld(); } },10000);
    return Promise.all([ux.id(),ux.canEdit(),dbx.collection('schools').get(),dbx.collection('edits').get(),dbx.doc('meta/app').get(),dbx.collection('claims').get(),dbx.collection('saran').get(),dbx.collection('balasan').get()]).then(function(r){
      clearTimeout(guard); myId=r[0];
      var admin=r[1], schools=r[2].docs.map(function(d){return d.data();}), edits={}, claims={}, meta=r[4].exists?r[4].data():null;
      r[3].docs.forEach(function(d){ edits[d.id]=d.data(); }); r[5].docs.forEach(function(d){ claims[d.id]=d.data(); }); r[6].docs.forEach(function(d){ state.saran[d.id]=d.data(); }); r[7].docs.forEach(function(d){ state.balasan[d.id]=d.data(); });
      var legacy=[]; schools.forEach(function(sc){ if(sc.kepsekUid && !claims[sc.kepsekUid]) legacy.push(sc); });
      Object.keys(claims).forEach(function(u){ schools.forEach(function(sc){ if(sc.id===claims[u].schoolId) sc.kepsekUid=u; }); });
      var m=metaOf(meta);
      if(admin){
        ROLE='pengawas'; state.tab='sekolah';
        if(schools.length||meta){ state.data={profile:m.profile,schools:mergeEdits(schools,edits),triwulanMeta:m.triwulanMeta,extraYears:m.extraYears}; }
        else { doSave(); }
        legacy.forEach(function(sc){ dbx.doc('claims/'+sc.kepsekUid).set({schoolId:sc.id}); });
        state.data.schools.forEach(function(sc){ synced['schools/'+sc.id]=canon(schoolDoc(sc)); if(sc.kepsekUid&&edits[sc.kepsekUid]) synced['edits/'+sc.kepsekUid]=canon({schoolId:sc.id,school:sc}); });
        if(meta) synced['meta/app']=canon({profile:state.data.profile,triwulanMeta:state.data.triwulanMeta,extraYears:state.data.extraYears});
        listen();
        return loadNames().then(fin);
      }
      var mine=schools.filter(function(sc){return sc.kepsekUid===myId;})[0];
      if(mine){ ROLE='kepsek'; state.tab='rapor'; var e=edits[myId]; var base=(e&&e.schoolId===mine.id&&e.school)?overlayBase(nz(e.school,myId),mine):mine; state.data={profile:m.profile,schools:[nz(base,myId)],triwulanMeta:m.triwulanMeta,extraYears:m.extraYears}; state.activeSchoolId=mine.id; if(e) synced['edits/'+myId]=canon(e); listenEdits(); return loadNames().then(fin); }
      return ux.can('data.write').then(function(w){
        if(w===true){ ROLE='pilih'; state.data={profile:m.profile,schools:schools.map(function(s){return nz(s,s.kepsekUid);}),triwulanMeta:{},extraYears:[]}; }
        else { ROLE='viewer'; state.tab='rapor'; state.data={profile:m.profile,schools:mergeEdits(schools,edits),triwulanMeta:m.triwulanMeta,extraYears:m.extraYears}; listen(); }
        return loadNames(); }).then(fin);
    });
  }
  function fin(){ state.loading=false; render(); listenSaran(); }
  function idle(){ var a=document.activeElement; return !(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)); }
  function applyEdit(uid,d){
    if(!d||!d.school||synced['edits/'+uid]===canon(d)) return false; var ch=false;
    state.data.schools.forEach(function(sc){ if(sc.kepsekUid===uid&&sc.id===d.schoolId){ var n=overlayBase(nz(d.school,uid),sc); Object.keys(sc).forEach(function(k){ delete sc[k]; }); Object.assign(sc,n); synced['edits/'+uid]=canon({schoolId:sc.id,school:sc}); synced['schools/'+sc.id]=canon(schoolDoc(sc)); ch=true; } });
    return ch;
  }
  function listenEdits(){
    dbx.collection('edits').onSnapshot(function(snap){
      var ch=false;
      snap.docChanges().forEach(function(c){ if(c.doc.metadata.hasPendingWrites||c.type==='removed') return; if(applyEdit(c.doc.id,c.doc.data())) ch=true; });
      if(ch&&!state.saveTimer&&idle()) render();
    },function(e){ console.error(e); });
  }
  function listen(){
    listenEdits();
    dbx.collection('claims').onSnapshot(function(snap){
      snap.docChanges().forEach(function(c){
        var u=c.doc.id, d=c.doc.data();
        if(c.type==='removed'){ state.data.schools.forEach(function(sc){ if(sc.kepsekUid===u) delete sc.kepsekUid; }); return; }
        state.data.schools.forEach(function(sc){ if(d&&sc.id===d.schoolId) sc.kepsekUid=u; });
        dbx.doc('edits/'+u).get().then(function(s){ if(s.exists&&applyEdit(u,s.data())&&idle()) render(); });
        loadNames().then(function(){ if(idle()) render(); });
      });
    },function(e){ console.error(e); });
  }
  var sarOn=false;
  function listenSaran(){
    if(!dbx||sarOn) return; sarOn=true;
    dbx.collection('saran').onSnapshot(function(snap){
      var ch=false;
      snap.docs.forEach(function(d){ var v=d.data(); if(canon(state.saran[d.id]||{})!==canon(v)){ state.saran[d.id]=v; ch=true; } });
      if(ch&&idle()) render();
    },function(e){ console.error(e); });
    dbx.collection('balasan').onSnapshot(function(snap){
      var ch=false;
      snap.docs.forEach(function(d){ var v=d.data(); if(canon(state.balasan[d.id]||{})!==canon(v)){ state.balasan[d.id]=v; ch=true; } });
      if(ch&&idle()) render();
    },function(e){ console.error(e); });
  }
}
boot();
})();
</script>
